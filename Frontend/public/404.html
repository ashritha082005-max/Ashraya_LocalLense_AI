<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ashraya AI</title>
  <script>
    const path = window.location.pathname;

    const repo = "/Ashraya_LocalLense_AI";

    if (path.startsWith(repo)) {
      const route = path.substring(repo.length);

      window.location.replace(
        repo + "/?redirect=" + encodeURIComponent(route + window.location.search)
      );
    }
  </script>
</head>
<body>
  <p>Redirecting to Ashraya AI...</p>
</body>
</html>
